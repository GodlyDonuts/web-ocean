name: Metal wallpaper validation
on:
  pull_request:
    paths:
      - 'macos/**'
      - 'tools/check-repository.py'
      - 'requirements-dev.txt'
      - '.github/workflows/gpu-gallery.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: metal-wallpaper-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gallery:
    # This label has successfully run this project's Metal gallery on arm64.
    # Intel runners cannot compile the renderer's native Float16 readbacks.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify supported runner
        run: |
          test "$(uname -m)" = arm64 || { echo 'Metal validation requires an Apple silicon/arm64 runner.'; exit 1; }
          system_profiler SPDisplaysDataType
      - run: python3 -m pip install --break-system-packages -r requirements-dev.txt
      - name: Build browser reference and check generated artifacts
        run: |
          npm ci
          npm run build
          git diff --exit-code -- ocean.html ocean.min.html
      - run: python3 tools/check-repository.py
      - run: python3 macos/Tests/test_render_gallery.py
      - name: Build and run windowless CPU and GPU regressions
        run: zsh macos/test-current.sh
      - name: Capture core ocean scenes and require valid benchmarks
        run: python3 macos/Tests/render_gallery.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocean-validation
          path: |
            macos/build/gallery/*.png
            macos/build/gallery/*.json
            macos/build/gallery/*.log
            macos/build/night-water-fix/verification.json
            macos/build/day-night/verification.json
            macos/build/weather/verification.json
            macos/build/coverage/report.json
            macos/build/headless/report.json
            macos/build/saver-efficiency/*verification.json
            macos/build/saver-efficiency/*.log
            macos/build/regional/verification.json
            macos/build/regional/*.log
            macos/build/wallpaper-lifecycle/verification.json
            macos/build/daylight-time/*.json
            macos/build/daylight-time/*.log
            macos/build/cloud-variety/verification.json
            macos/build/cloud-variety/*.log
            macos/build/cloud-variety/gallery.png
