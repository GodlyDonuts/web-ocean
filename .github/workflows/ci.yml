name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- ocean.html ocean.min.html
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/check-repository.py
  native-build-and-unit-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: zsh macos/build.sh
      - run: zsh macos/test-unit.sh
      # Hosted runners do not establish Metal rendering quality or frame time.
      # Run macos/test-current.sh on an Apple silicon Mac for GPU validation.
